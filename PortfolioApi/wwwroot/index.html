<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mousaab Portfolio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="hero">
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="تبديل الوضع">☀️</button>
        <h1>MOSAAB MAKAHLEH</h1>
        <img src="images/profile.jpg" alt="img mousaab" class="avatar">
        <p>Software Engineer | Full Stack Developer</p>

    </header>

    <main>
        <section id="projects">
            <h2>My Projects</h2>
            <div id="projects-list" class="grid"></div>
        </section>
        <section id="skills">
            <h2>My Skills</h2>
            <div id="skills-list" class="grid"></div>
        </section>
        <section id="contact">
            <h2>Content Me</h2>
            <form id="contact-form" class="contact-form">
                <input type="text" id="contact-name" placeholder="Name: " required maxlength="100">
                <input type="email" id="contact-email" placeholder="Email: " required maxlength="150">
                <textarea id="contact-content" placeholder="Your Message" rows="5" required maxlength="2000"></textarea>
                <button type="submit">Send</button>
                <p id="form-status" role="status"></p>
            </form>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
