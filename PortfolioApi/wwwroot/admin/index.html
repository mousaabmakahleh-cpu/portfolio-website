<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Admin — Portfolio</title>
    <link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
    <script src="../js/theme-init.js"></script>
    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="admin.css">
    <script type="module" src="js/main.js"></script>
</head>
<body>
    <!-- ============ Login ============ -->
    <main id="login-view" class="login" hidden>
        <form id="login-form" class="login__card">
            <span class="brand-mark">MM</span>
            <h1>Admin dashboard</h1>
            <p class="muted">Sign in to manage your portfolio.</p>
            <label class="field">
                <span>Username</span>
                <input type="text" id="login-username" required autocomplete="username">
            </label>
            <label class="field">
                <span>Password</span>
                <input type="password" id="login-password" required autocomplete="current-password">
            </label>
            <button type="submit" class="btn btn--primary btn--block">Sign in</button>
            <p id="login-status" class="status" role="status"></p>
        </form>
    </main>

    <!-- ============ Dashboard ============ -->
    <div id="dashboard-view" class="shell" hidden>
        <aside class="sidebar">
            <a class="sidebar__brand" href="/" target="_blank" rel="noopener">
                <span class="brand-mark">MM</span>
                <span>Portfolio<small>View site ↗</small></span>
            </a>
            <nav class="sidebar__nav" id="sidebar-nav" aria-label="Dashboard sections"></nav>
            <button id="logout-button" type="button" class="btn btn--ghost btn--block">Log out</button>
        </aside>

        <main class="content" id="content" tabindex="-1"></main>
    </div>

    <dialog id="confirm-dialog" class="dialog">
        <form method="dialog">
            <h2 id="confirm-title">Are you sure?</h2>
            <p id="confirm-text" class="muted"></p>
            <div class="dialog__actions">
                <button value="cancel" class="btn btn--ghost">Cancel</button>
                <button value="ok" class="btn btn--danger">Delete</button>
            </div>
        </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
